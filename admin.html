<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم بطاقة NFC</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, Tahoma, sans-serif;
}

body {
  margin: 0;
  background: #111827;
  color: white;
  padding: 20px;
}

.container {
  max-width: 600px;
  margin: auto;
}

h1 {
  text-align: center;
  margin-bottom: 25px;
}

.box {
  background: #1f2937;
  padding: 20px;
  border-radius: 18px;
  margin-bottom: 20px;
}

label {
  display: block;
  margin: 15px 0 7px;
}

input {
  width: 100%;
  padding: 13px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  margin-top: 15px;
  font-size: 16px;
  cursor: pointer;
}

.save {
  background: #22c55e;
  color: white;
}

.preview {
  background: #374151;
  color: white;
}

#status {
  margin-top: 15px;
  text-align: center;
  line-height: 1.6;
}
</style>
</head>

<body>

<div class="container">

<h1>⚙️ لوحة تحكم بطاقة NFC</h1>

<div class="box">

<label>GitHub Token</label>
<input
  id="token"
  type="password"
  placeholder="ضع GitHub Token هنا">

<label>اسمك</label>
<input
  id="name"
  placeholder="مثال: معتز عمرو">

<label>المسمى الوظيفي</label>
<input
  id="job"
  placeholder="مثال: Accountant">

<label>رابط الصورة</label>
<input
  id="photo"
  placeholder="https://...">

<label>رقم الهاتف</label>
<input
  id="phone"
  placeholder="201000000000">

<label>رقم واتساب</label>
<input
  id="whatsapp"
  placeholder="201000000000">

<label>Instagram</label>
<input
  id="instagram"
  placeholder="https://instagram.com/...">

<label>Facebook</label>
<input
  id="facebook"
  placeholder="https://facebook.com/...">

<label>البريد الإلكتروني</label>
<input
  id="email"
  placeholder="example@email.com">

<button class="save" onclick="saveChanges()">
💾 حفظ التعديلات
</button>

<button class="preview" onclick="preview()">
👀 معاينة الموقع
</button>

<div id="status"></div>

</div>

</div>

<script>

const OWNER = "moatazamryahia2000-del";
const REPO = "nfc_card_site";
const FILE = "index.html";
const BRANCH = "main";

function value(id) {
  return document.getElementById(id).value.trim();
}

function escapeHTML(text) {
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function makeHTML() {

  const name = escapeHTML(value("name"));
  const job = escapeHTML(value("job"));
  const photo = escapeHTML(value("photo"));
  const phone = escapeHTML(value("phone"));
  const whatsapp = escapeHTML(value("whatsapp"));
  const instagram = escapeHTML(value("instagram"));
  const facebook = escapeHTML(value("facebook"));
  const email = escapeHTML(value("email"));

return `<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>${name || "بطاقتي الرقمية"}</title>

<style>

* {
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,Tahoma,sans-serif;
}

body {
min-height:100vh;
background:linear-gradient(135deg,#111827,#1f2937);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.card {
width:100%;
max-width:430px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.15);
border-radius:25px;
padding:30px 20px;
text-align:center;
backdrop-filter:blur(15px);
box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.logo {
width:110px;
height:110px;
border-radius:50%;
object-fit:cover;
background:white;
padding:5px;
margin-bottom:15px;
}

h1 {
font-size:28px;
margin-bottom:8px;
}

.job {
color:#d1d5db;
margin-bottom:25px;
font-size:15px;
}

.links {
display:flex;
flex-direction:column;
gap:13px;
}

.links a {
text-decoration:none;
color:white;
background:rgba(255,255,255,.12);
border:1px solid rgba(255,255,255,.12);
padding:15px;
border-radius:14px;
font-size:17px;
display:block;
}

.links a:hover {
background:rgba(255,255,255,.2);
}

.footer {
margin-top:25px;
color:#9ca3af;
font-size:12px;
}

</style>

</head>

<body>

<div class="card">

<img
class="logo"
src="${photo || "https://via.placeholder.com/150"}"
alt="الصورة">

<h1>${name || "اسمك هنا"}</h1>

<div class="job">
${job || "المسمى الوظيفي"}
</div>

<div class="links">

<a href="tel:+${phone}">
📞 اتصال
</a>

<a href="https://wa.me/${whatsapp}">
💬 WhatsApp
</a>

<a href="${instagram}">
📷 Instagram
</a>

<a href="${facebook}">
📘 Facebook
</a>

<a href="mailto:${email}">
✉️ البريد الإلكتروني
</a>

</div>

<div class="footer">
Digital NFC Card
</div>

</div>

</body>
</html>`;
}

function base64Encode(str) {
  return btoa(unescape(encodeURIComponent(str)));
}

async function saveChanges() {

  const token = value("token");

  if (!token) {
    document.getElementById("status").innerHTML =
      "❌ لازم تحط GitHub Token أولًا.";
    return;
  }

  document.getElementById("status").innerHTML =
    "⏳ جاري حفظ التعديلات...";

  try {

    const api =
      `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`;

    const response = await fetch(api, {
      headers: {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/vnd.github+json"
      }
    });

    if (!response.ok) {
      throw new Error("تعذر الوصول إلى الملف.");
    }

    const oldFile = await response.json();

    const newHTML = makeHTML();

    const update = await fetch(api, {

      method: "PUT",

      headers: {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        message: "Update NFC card",

        content: base64Encode(newHTML),

        sha: oldFile.sha,

        branch: BRANCH

      })

    });

    if (!update.ok) {

      const error = await update.json();

      throw new Error(
        error.message || "فشل حفظ التعديلات"
      );

    }

    document.getElementById("status").innerHTML =
      "✅ تم حفظ التعديلات بنجاح.<br>" +
      "قد يستغرق ظهورها على الموقع دقيقة أو دقيقتين.";

  } catch (error) {

    document.getElementById("status").innerHTML =
      "❌ حصل خطأ: " + error.message;

  }
}

function preview() {

  const html = makeHTML();

  const blob =
    new Blob([html], {type:"text/html"});

  const url =
    URL.createObjectURL(blob);

  window.open(url, "_blank");
}

</script>

</body>
  </html>
