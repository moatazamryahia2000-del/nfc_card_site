<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>بطاقتي الرقمية</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #1f2937);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: white;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 25px;
      padding: 30px 20px;
      text-align: center;
      backdrop-filter: blur(15px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }

    .logo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      background: white;
      padding: 5px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .job {
      color: #d1d5db;
      margin-bottom: 25px;
      font-size: 15px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .links a {
      text-decoration: none;
      color: white;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 15px;
      border-radius: 14px;
      font-size: 17px;
      transition: 0.2s;
      display: block;
    }

    .links a:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.2);
    }

    .footer {
      margin-top: 25px;
      color: #9ca3af;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- ضع رابط صورتك هنا -->
    <img
      class="logo"
      src="https://via.placeholder.com/150"
      alt="الصورة">

    <!-- غير الاسم هنا -->
    <h1>اسمك هنا</h1>

    <!-- غير الوظيفة هنا -->
    <div class="job">المسمى الوظيفي</div>

    <div class="links">

      <!-- غير رقم الهاتف -->
      <a href="tel:+201000000000">
        📞 اتصال
      </a>

      <!-- غير رقم الواتساب -->
      <a href="https://wa.me/201000000000">
        💬 WhatsApp
      </a>

      <!-- ضع رابط Instagram -->
      <a href="https://instagram.com/">
        📷 Instagram
      </a>

      <!-- ضع رابط Facebook -->
      <a href="https://facebook.com/">
        📘 Facebook
      </a>

      <!-- ضع الإيميل -->
      <a href="mailto:example@email.com">
        ✉️ البريد الإلكتروني
      </a>

    </div>

    <div class="footer">
      Digital NFC Card
    </div>

  </div>

</body>
  </html>
